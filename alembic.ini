[alembic]
script_location = stacksmith_platform:migrations
file_template = %%(year)d-%%(month).2d-%%(day).2d-%%(hour).2d-%%(minute).2d_%%(rev)s
prepend_sys_path = src
output_encoding = utf-8

[post_write_hooks]
hooks = ruff_check,ruff_format
ruff_check.type = exec
ruff_check.executable = ruff
ruff_check.options = check --fix-only --select F401,I REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
