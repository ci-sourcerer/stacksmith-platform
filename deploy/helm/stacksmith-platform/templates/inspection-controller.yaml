{{- if .Values.inspectionPool.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-inspections
spec:
  replicas: {{ .Values.inspectionPool.replicas }}
  selector:
    matchLabels: {app: {{ .Release.Name | quote }}, role: inspection}
  template:
    metadata:
      labels: {app: {{ .Release.Name | quote }}, role: inspection}
    spec:
      serviceAccountName: {{ default (printf "%s-inspection" .Release.Name) .Values.serviceAccounts.inspection.name }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: inspection-controller
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [stacksmith-platform-inspections]
          envFrom:
            - secretRef: {name: {{ .Values.configSecret }}}
            - secretRef: {name: {{ .Values.supervisorDatabaseSecret }}}
          env:
            {{- include "stacksmith.executionEnv" . | nindent 12 }}
          resources: {{ .Values.inspectionPool.resources | toYaml | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [python, -m, stacksmith_platform.inspection_health]}
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          livenessProbe:
            exec: {command: [python, -m, stacksmith_platform.inspection_health]}
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
{{- end }}
