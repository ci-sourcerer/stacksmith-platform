events {}

http {
    access_log off;
    server {
        listen 9000;
        client_max_body_size 0;
        location / {
            proxy_pass http://storage-backend:9000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
